<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c2c2c">
  <title>游戏角 · 红黑观察员</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      background: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px;
      color: #eee;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }
    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 36px;
      text-align: center;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: min(88vw, 340px);
    }
    a.entry {
      display: flex;
      flex-direction: column;
      padding: 22px 24px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      background: #3a3a3a;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    a.entry:active { transform: scale(0.97); background: #4a4a4a; }
    a.entry.single { background: linear-gradient(135deg, #3a6ea5, #2b527a); }
    a.entry.online { background: linear-gradient(135deg, #0a7c4e, #08603c); }
    .entry-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .entry-desc { font-size: 13px; color: rgba(255,255,255,0.8); line-height: 1.5; }
    .footer { margin-top: 36px; font-size: 12px; color: #666; text-align: center; }
  </style>
</head>
<body>
  <h1>游戏角</h1>
  <div class="subtitle">选择一种游戏</div>

  <div class="menu">
    <a class="entry online" href="./online.html">
      <div class="entry-title">五子棋</div>
      <div class="entry-desc">创建房间或输入房号，与好友实时对战</div>
    </a>
    <a class="entry" href="./TQ.html" style="background:linear-gradient(135deg,#1fcaae,#17a398);">
      <div class="entry-title">中国跳棋</div>
      <div class="entry-desc">创建房间或输入房号，与好友实时对战</div>
    </a>
    <a class="entry" href="./FX.html" style="background:linear-gradient(135deg,#2e08d3,#0b1cb4);">
      <div class="entry-title">飞行棋</div>
      <div class="entry-desc">创建房间或输入房号，与好友实时对战</div>
    </a>
    <a class="entry" href="./mahjong.html" style="background:linear-gradient(135deg,#8e44ad,#6c3483);">
      <div class="entry-title">广东麻将</div>
      <div class="entry-desc">无吃·可碰杠·自摸点炮</div>
    </a>
  </div>

  <div class="footer">手机浏览器体验更佳</div>
</body>
</html>
