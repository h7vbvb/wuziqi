<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2c2c2c">
  <title>五子棋 · 红黑观察员</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #2c2c2c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 12px;
      color: #eee;
      overflow-x: hidden;
    }

    .game-container {
      background: #d4a76a;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      width: min(92vw, 92vh, 620px);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      touch-action: manipulation;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      font-size: 16px;
      text-align: center;
      min-height: 24px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #3a3a3a;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      user-select: none;
    }

    button:active {
      background: #555;
      transform: scale(0.97);
    }

    button.primary {
      background: #0a7c4e;
    }

    button.primary:active {
      background: #0b9e63;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .mode-switch button {
      font-size: 13px;
      padding: 8px 14px;
      background: #3a3a3a;
    }

    .mode-switch button.active {
      background: #0a7c4e;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="board" width="600" height="600"></canvas>
  </div>
  <div id="status">黑棋回合</div>
  <div class="controls">
    <button class="primary" onclick="restartGame()">重新开始</button>
    <button onclick="undoMove()">悔棋</button>
  </div>
  <div class="mode-switch">
    <button id="modePvp" class="active" onclick="setMode('pvp')">双人对战</button>
    <button id="modeAi" onclick="setMode('ai')">人机对战</button>
  </div>

  <script>
    (function () {
      'use strict';

      // ===== DOM =====
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const statusEl = document.getElementById('status');

      // ===== 常量 =====
      const SIZE = 15;                          // 15x15 棋盘
      const PADDING = 30;                       // 棋盘边距（画布像素）
      const CANVAS_SIZE = 600;
      const CELL = (CANVAS_SIZE - PADDING * 2) / (SIZE - 1);

      // ===== 状态 =====
      let board = [];                           // 0 空 / 1 黑 / 2 白
      let currentPlayer = 1;                    // 1 黑先手
      let gameOver = false;
      let history = [];                         // { row, col, player }
      let mode = 'pvp';                         // 'pvp' | 'ai'
      let aiThinking = false;

      // ===== 初始化 =====
      function initBoard() {
        board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
        currentPlayer = 1;
        gameOver = false;
        history = [];
        aiThinking = false;
        statusEl.textContent = '黑棋回合';
        draw();
      }

      // ===== 绘制 =====
      function draw() {
        // 背景
        ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        ctx.fillStyle = '#e8c48a';
        ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

        // 网格线
        ctx.strokeStyle = '#8b6b3d';
        ctx.lineWidth = 1.2;
        for (let i = 0; i < SIZE; i++) {
          const pos = PADDING + i * CELL;

          ctx.beginPath();
          ctx.moveTo(PADDING, pos);
          ctx.lineTo(CANVAS_SIZE - PADDING, pos);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(pos, PADDING);
          ctx.lineTo(pos, CANVAS_SIZE - PADDING);
          ctx.stroke();
        }

        // 天元点
        const center = PADDING + 7 * CELL;
        ctx.fillStyle = '#5a3e1b';
        ctx.beginPath();
        ctx.arc(center, center, 4, 0, Math.PI * 2);
        ctx.fill();

        // 棋子
        for (let row = 0; row < SIZE; row++) {
          for (let col = 0; col < SIZE; col++) {
            const val = board[row][col];
            if (!val) continue;

            const cx = PADDING + col * CELL;
            const cy = PADDING + row * CELL;
            const radius = CELL * 0.42;

            // 阴影
            ctx.beginPath();
            ctx.arc(cx + 2, cy + 2, radius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fill();

            // 棋子
            const gradient = ctx.createRadialGradient(
              cx - radius * 0.3,
              cy - radius * 0.3,
              radius * 0.1,
              cx,
              cy,
              radius
            );

            if (val === 1) {
              gradient.addColorStop(0, '#777');
              gradient.addColorStop(0.6, '#111');
              gradient.addColorStop(1, '#000');
            } else {
              gradient.addColorStop(0, '#fff');
              gradient.addColorStop(0.7, '#eee');
              gradient.addColorStop(1, '#ccc');
            }

            ctx.beginPath();
            ctx.arc(cx, cy, radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.strokeStyle = val === 1 ? '#000' : '#999';
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      // ===== 胜负判断 =====
      function checkWin(row, col, player) {
        const dirs = [
          [1, 0],
          [0, 1],
          [1, 1],
          [1, -1]
        ];

        for (const [dx, dy] of dirs) {
          let count = 1;

          for (let step = 1; step < 5; step++) {
            const nr = row + dx * step;
            const nc = col + dy * step;
            if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
            if (board[nr][nc] !== player) break;
            count++;
          }

          for (let step = 1; step < 5; step++) {
            const nr = row - dx * step;
            const nc = col - dy * step;
            if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
            if (board[nr][nc] !== player) break;
            count++;
          }

          if (count >= 5) return true;
        }

        return false;
      }

      // ===== 落子 =====
      function placeStone(row, col) {
        if (gameOver || aiThinking) return false;
        if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return false;
        if (board[row][col] !== 0) return false;

        board[row][col] = currentPlayer;
        history.push({ row, col, player: currentPlayer });
        draw();

        if (checkWin(row, col, currentPlayer)) {
          gameOver = true;
          statusEl.textContent = currentPlayer === 1 ? '⚫ 黑棋获胜！' : '⚪ 白棋获胜！';
          return true;
        }

        currentPlayer = currentPlayer === 1 ? 2 : 1;
        statusEl.textContent = currentPlayer === 1 ? '黑棋回合' : '白棋回合';

        if (mode === 'ai' && currentPlayer === 2 && !gameOver) {
          aiThinking = true;
          statusEl.textContent = 'AI 思考中...';
          setTimeout(aiMove, 350);
        }

        return true;
      }

      // ===== 简易 AI =====
      function aiMove() {
        if (gameOver) {
          aiThinking = false;
          return;
        }

        // 1. AI 能直接获胜
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] !== 0) continue;
            board[r][c] = 2;
            const win = checkWin(r, c, 2);
            board[r][c] = 0;
            if (win) {
              aiThinking = false;
              placeStone(r, c);
              return;
            }
          }
        }

        // 2. 堵住玩家直接获胜
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] !== 0) continue;
            board[r][c] = 1;
            const win = checkWin(r, c, 1);
            board[r][c] = 0;
            if (win) {
              aiThinking = false;
              placeStone(r, c);
              return;
            }
          }
        }

        // 3. 已有棋子附近随机落子
        const candidates = [];

        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            if (board[r][c] !== 0) continue;

            let hasNeighbor = false;

            for (let dr = -2; dr <= 2 && !hasNeighbor; dr++) {
              for (let dc = -2; dc <= 2 && !hasNeighbor; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr;
                const nc = c + dc;
                if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] !== 0) {
                  hasNeighbor = true;
                }
              }
            }

            if (hasNeighbor) candidates.push({ r, c });
          }
        }

        let pick;

        if (candidates.length > 0) {
          pick = candidates[Math.floor(Math.random() * candidates.length)];
        } else {
          pick = { r: 7, c: 7 };
        }

        aiThinking = false;
        placeStone(pick.r, pick.c);
      }

      // ===== 交互 =====
      canvas.addEventListener('click', (e) => {
        if (mode === 'ai' && currentPlayer === 2) return;
        if (aiThinking || gameOver) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;

        const col = Math.round((x - PADDING) / CELL);
        const row = Math.round((y - PADDING) / CELL);

        if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;

        const snapX = PADDING + col * CELL;
        const snapY = PADDING + row * CELL;

        if (Math.hypot(x - snapX, y - snapY) > CELL * 0.5) return;

        placeStone(row, col);
      });

      // ===== 悔棋 =====
      function undoMove() {
        if (aiThinking) return;

        if (gameOver) {
          gameOver = false;
        }

        if (mode === 'ai') {
          if (history.length < 2) return;

          const last1 = history.pop();
          board[last1.row][last1.col] = 0;

          const last2 = history.pop();
          board[last2.row][last2.col] = 0;

          currentPlayer = 1;
        } else {
          if (history.length === 0) return;

          const last = history.pop();
          board[last.row][last.col] = 0;
          currentPlayer = last.player;
        }

        statusEl.textContent = currentPlayer === 1 ? '黑棋回合' : '白棋回合';
        draw();
      }

      // ===== 重新开始 =====
      function restartGame() {
        initBoard();
      }

      // ===== 切换模式 =====
      function setMode(m) {
        if (aiThinking) return;
        mode = m;
        document.getElementById('modePvp').classList.toggle('active', m === 'pvp');
        document.getElementById('modeAi').classList.toggle('active', m === 'ai');
        restartGame();
      }

      // ===== 暴露给内联 onclick =====
      window.restartGame = restartGame;
      window.undoMove = undoMove;
      window.setMode = setMode;

      // ===== 启动 =====
      initBoard();
    })();
  </script>
</body>
</html>
